# ============================================================
# 重要说明:
# 1. 本文件中的所有字段, 若被 toml / json / 构建脚本引用,
#    必须同步添加到 buildSrc/src/main/groovy/multiloader-common.gradle
#    的 expandProps 映射表中, 否则资源文件中的 ${xxx} 不会被替换。
# 2. 切换 Minecraft 版本时, 请参考 README.md 中的《版本切换指南》。
# ============================================================

# ---------- 项目信息 ----------
version=1.0.0
group=com.eternalitems
java_version=21

# ---------- 通用(Common) ----------
# 目标 Minecraft 版本 (支持: 1.20.1 / 1.21.1, 更多见 README)
minecraft_version=1.21.1
mod_name=永恒物品
mod_author=3695861920
mod_id=eternalitems
license=MIT
credits=
description=永恒物品 (Eternal Items) —— 让物品永恒不朽的模组。\n包含永恒钻石等拥有永恒光辉的传奇物品。
# Minecraft 版本范围, 用于 mods.toml / neoforge.mods.toml 的依赖声明
minecraft_version_range=[1.21.1, 1.22)
# common 模块使用的 NeoForm 版本(纯净原版反编译产物)
# 版本列表: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# ParchmentMC 映射(更好的参数名与 Javadoc), 版本列表: https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21
parchment_version=2024.11.10

# ---------- Forge ----------
# Forge 版本: https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=52.1.16
forge_loader_version_range=[52,)

# ---------- NeoForge ----------
# NeoForge 版本: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.248
neoforge_loader_version_range=[4,)

# ---------- 构建工具 ----------
# ModDevGradle 版本: https://projects.neoforged.net/neoforged/moddevgradle
moddev_gradle_version=2.0.141

# ---------- Gradle ----------
# 低内存环境 (CI/容器) 请保持较小堆; 本地高配机器可调大
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.daemon=false
